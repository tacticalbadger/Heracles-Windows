[package]
name = "heracles-bindgen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates the Swift bindings for heracles-core. Run by macos/build-core.sh."

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
